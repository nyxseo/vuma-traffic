<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Starting Vuma Traffic</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Inter',-apple-system,sans-serif;background:transparent;color:#f1f5f9;display:flex;align-items:center;justify-content:center;height:100vh;overflow:hidden}

    .splash{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
      background:linear-gradient(135deg,#020617 0%,#0f1729 50%,#1a2744 100%);
      position:relative}
    .splash::before{content:'';position:absolute;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(59,130,246,0.1),transparent 70%);top:-80px;right:-80px}
    .splash::after{content:'';position:absolute;width:250px;height:250px;border-radius:50%;background:radial-gradient(circle,rgba(139,92,246,0.08),transparent 70%);bottom:-60px;left:-60px}

    .logo{font-size:2.5rem;font-weight:800;background:linear-gradient(135deg,#60a5fa,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:0.5rem}
    .tagline{font-size:0.8125rem;color:#475569;margin-bottom:3rem}

    .loader{width:160px;height:3px;background:rgba(255,255,255,0.06);border-radius:999px;overflow:hidden}
    .loader-bar{height:100%;width:0%;background:linear-gradient(90deg,#3b82f6,#6366f1);border-radius:999px;animation:load 1.8s cubic-bezier(0.16,1,0.3,1) forwards}
    @keyframes load{0%{width:0%}50%{width:55%}100%{width:85%}}

    .version{position:absolute;bottom:2rem;font-size:0.6875rem;color:#334155}
  </style>
</head>
<body>
  <div class="splash">
    <div class="logo">Vuma</div>
    <div class="tagline">Traffic Automation Engine</div>
    <div class="loader"><div class="loader-bar"></div></div>
    <div class="version">v1.0.0</div>
  </div>
</body>
</html>
